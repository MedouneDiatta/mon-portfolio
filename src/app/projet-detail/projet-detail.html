<!-- On vérifie si un projet a bien été trouvé. Si oui, on affiche ses détails, sinon on bascule sur le bloc de secours #introuvable -->
<div *ngIf="projetTrouve; else introuvable">
  <!-- Affichage du titre du projet -->
  <h2>{{ projetTrouve.titre }}</h2>

  <!-- Affichage de la description -->
  <p>{{ projetTrouve.description }}</p>

  <!-- Liste des technologies utilisées (boucle *ngFor pour parcourir le tableau) -->
  <ul>
    <li *ngFor="let techno of projetTrouve.technos">{{ techno }}</li>
  </ul>

  <!-- Lien vers le dépôt GitHub (affiché uniquement si le lien existe grâce au *ngIf) -->
  <a *ngIf="projetTrouve.lienGithub" [href]="projetTrouve.lienGithub" target="_blank"
    >Voir sur GitHub</a
  >
  <br />

  <!-- Lien de navigation pour revenir à la page d'accueil sans recharger la page (RouterLink) -->
  <a routerLink="/">← Retour à l'accueil</a>
</div>

<!-- Bloc de secours affiché si l'ID du projet dans l'URL n'existe pas dans notre liste -->
<ng-template #introuvable>
  <p>Projet introuvable.</p>
  <a routerLink="/">← Retour à l'accueil</a>
</ng-template>
